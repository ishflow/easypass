name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # slnx dört projeyi (WPF dahil) derler, sonra testleri çalıştırır
      - run: dotnet test EasyPass.slnx -c Release
      - run: |
          dotnet publish src/EasyPass.App/EasyPass.App.csproj -c Release -r win-x64 --self-contained false -o publish
          dotnet publish src/EasyPass.Host/EasyPass.Host.csproj -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: EasyPass
          path: |
            publish/
            extension/
            scripts/
            README.md
